<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-labelledby="titulo descripcion">
  <title id="titulo">Un tren y sus pasajeros: por qué la lista usa doble corchete</title>
  <desc id="descripcion">Arriba, el data frame datos_casos es un tren de tres vagones, ID_Caso, Edad y Hospitalizado, y cada vagón lleva tres pasajeros: hay filas. datos_casos["Edad"] devuelve un tren más corto; datos_casos[, "Edad"], con la coma, baja a los pasajeros 25, 42 y 31. Abajo, la lista investigacion_brote es un tren de cuatro vagones, Nombre, Datos, Contactos y Activo, que llevan cosas distintas: no hay filas. investigacion_brote["Nombre"] devuelve un tren más corto; investigacion_brote[["Nombre"]], con doble corchete, baja al pasajero "Nuevo brote". Dibujo propio del curso; la analogía del tren es de Hadley Wickham, Advanced R, 2.ª ed., sección 4.3.1.</desc>
