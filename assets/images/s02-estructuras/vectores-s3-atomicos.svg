<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 660" width="920" height="660" role="img" aria-labelledby="titulo descripcion">
  <title id="titulo">Dónde está el factor entre los vectores</title>
  <desc id="descripcion">Árbol de los vectores atómicos: Logical, Integer, Double y Character son atómicos; Integer y Double son además numéricos. En azul, factor se construye sobre Integer, y POSIXct y Date sobre Double. Redibujada de Hadley Wickham, Advanced R, 2.ª ed., sección 3.4, CC BY-NC-SA 4.0.</desc>
  <defs>
    <marker id="punta-negra" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="28" markerHeight="28" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
    <marker id="punta-azul" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="26" markerHeight="26" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1D5C9B"/>
    </marker>
  </defs>

  <g stroke="#000" stroke-width="5" fill="none" marker-end="url(#punta-negra)">
    <line x1="460" y1="160" x2="460" y2="78"/>
    <line x1="460" y1="318" x2="460" y2="232"/>
    <line x1="145" y1="468" x2="400" y2="234"/>
    <line x1="765" y1="468" x2="520" y2="234"/>
    <line x1="365" y1="468" x2="425" y2="394"/>
    <line x1="530" y1="468" x2="492" y2="394"/>
  </g>
  <g stroke="#1D5C9B" stroke-width="4.5" fill="none" marker-end="url(#punta-azul)">
    <line x1="300" y1="600" x2="323" y2="538"/>
    <line x1="520" y1="600" x2="543" y2="538"/>
    <line x1="700" y1="600" x2="607" y2="538"/>
  </g>

  <g font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="48" text-anchor="middle" fill="#000">
    <text x="460" y="52">Vector</text>
    <text x="460" y="205">Atomic</text>
    <text x="460" y="365">Numeric</text>
    <text x="115" y="512">Logical</text>
    <text x="335" y="512">Integer</text>
    <text x="560" y="512">Double</text>
    <text x="790" y="512">Character</text>
    <g font-style="italic">
      <text x="280" y="645">factor</text>
      <text x="510" y="645">POSIXct</text>
      <text x="720" y="645">Date</text>
    </g>
  </g>
</svg>
