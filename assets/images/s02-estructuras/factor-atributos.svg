<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 610 370" width="610" height="370" role="img" aria-labelledby="titulo descripcion">
  <title id="titulo">Un factor por dentro</title>
  <desc id="descripcion">El vector de enteros 1 2 2 1 lleva dos atributos: class, con el valor "factor", y levels, con los valores "a" y "b". Redibujada de Hadley Wickham, Advanced R, 2.ª ed., sección 3.4.1, CC BY-NC-SA 4.0.</desc>
  <defs>
    <marker id="punta" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="26" markerHeight="26" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
  </defs>
  <g font-family="'JetBrains Mono', 'Fira Code', 'SF Mono', Menlo, Consolas, monospace" font-size="34" text-anchor="middle" fill="#000">
    <rect x="36" y="36" width="284" height="70" fill="#fff" stroke="#000" stroke-width="4"/>
    <line x1="107" y1="36" x2="107" y2="106" stroke="#000" stroke-width="3"/>
    <line x1="178" y1="36" x2="178" y2="106" stroke="#000" stroke-width="3"/>
    <line x1="249" y1="36" x2="249" y2="106" stroke="#000" stroke-width="3"/>
    <rect x="320" y="36" width="26" height="70" fill="#000" stroke="#000" stroke-width="4"/>
    <text x="71.5" y="83">1</text>
    <text x="142.5" y="83">2</text>
    <text x="213.5" y="83">2</text>
    <text x="284.5" y="83">1</text>

    <path d="M346,68 C420,52 474,74 480,138" fill="none" stroke="#000" stroke-width="4" marker-end="url(#punta)"/>

    <rect x="202" y="152" width="394" height="194" fill="#fff" stroke="#000" stroke-width="4"/>
    <line x1="356" y1="152" x2="356" y2="346" stroke="#000" stroke-width="3"/>
    <line x1="202" y1="249" x2="596" y2="249" stroke="#000" stroke-width="3"/>
    <text x="340" y="212" text-anchor="end">class</text>
    <text x="340" y="309" text-anchor="end">levels</text>
    <rect x="368" y="163" width="216" height="74" fill="#EBEBEB" stroke="#000" stroke-width="3.5"/>
    <text x="476" y="212">"factor"</text>
    <rect x="368" y="260" width="108" height="74" fill="#EBEBEB" stroke="#000" stroke-width="3.5"/>
    <rect x="476" y="260" width="108" height="74" fill="#EBEBEB" stroke="#000" stroke-width="3.5"/>
    <text x="422" y="309">"a"</text>
    <text x="530" y="309">"b"</text>
  </g>
</svg>
